name: Create New Gem

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      protoPath:
        description: "The path to the protos"
        required: true
      args:
        description: "Extra command line arguments."
        required: false

jobs:
  NewGem:
    if: ${{ github.repository == 'googleapis/common-protos-ruby' }}
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.YOSHI_CODE_BOT_TOKEN }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install Ruby 3.4
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "3.4"
      - name: Install tools
        run: "gem install --no-document 'toys:~> 0.22.0' grpc-tools:1.62.0"
      - name: execute
        run: |
          toys new-gem -v --fork ${GITHUB_EVENT_INPUTS_PROTOPATH} ${GITHUB_EVENT_INPUTS_ARGS}
        env:
          GITHUB_EVENT_INPUTS_PROTOPATH: ${{ github.event.inputs.protoPath }}
          GITHUB_EVENT_INPUTS_ARGS: ${{ github.event.inputs.args }}
